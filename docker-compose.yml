version: '3.8'

services:
  # --- DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: sent_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: sent_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- BACKEND ---
  backend:
    build: ./SENT_backend
    container_name: sent_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=your_password_here
      - DB_NAME=sent_database
      - PORT=8000

  # --- FRONTEND ---
  frontend:
    build: ./SENT_frontend
    container_name: sent_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true # Giữ cho React không bị tắt log

volumes:
  postgres_data: