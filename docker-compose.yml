
services:
  # --- DATABASE: PostgreSQL ---
  redis:
    image: redis:7-alpine  
    container_name: sent_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - sent_net
  db:
    image: postgres:15-alpine
    container_name: sent_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Thanh@123"
      POSTGRES_DB: sent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sent_net
  
  mongodb:
    image: mongo:6.0
    container_name: sent_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - sent_net
  backend:
    build: ./SENT_backend
    container_name: sent_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mongodb
      - redis
    env_file:
      - ./SENT_backend/.env 
    environment:
      - DB_HOST=db
      - MONGO_HOST=mongodb
      - REDIS_HOST=redis
    volumes:
      - ./SENT_backend/uploads:/app/uploads
    networks:
      - sent_net
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: sent_converter
    restart: always
    networks:
      - sent_net
  frontend:
    build:
      context: ./SENT_frontend
      args:
        - VITE_API_URL=/api/v1
    container_name: sent_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    stdin_open: true
    networks:
      - sent_net
  sent-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sent_tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: always
    networks:
      - sent_net

networks:
  sent_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data: