version: '3.8'

services:
  # --- DATABASE: PostgreSQL ---
  db:
    image: postgres:15-alpine
    container_name: sent_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Thanh@123"
      POSTGRES_DB: sent_db
    # Port 5432 chỉ mở nếu bạn muốn kết nối từ ngoài vào để debug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- DATABASE: MongoDB ---
  mongodb:
    image: mongo:4.4
    container_name: sent_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- BACKEND (Golang Alpine) ---
  backend:
    build: ./SENT_backend
    container_name: sent_backend
    restart: always
    # Không cần mở port 8000 ra ngoài nếu đã có Nginx ở Frontend làm Proxy
    expose:
      - "8000"
    depends_on:
      - db
      - mongodb
    env_file:
      - ./SENT_backend/.env # Tự động load tất cả biến từ file .env bạn đã tạo
    environment:
      - DB_HOST=db
      - MONGO_HOST=mongodb # Sửa lại cho khớp với tên service ở trên
    volumes:
      - ./SENT_backend/uploads:/app/uploads # Lưu trữ tài liệu SOC bền vững

  # --- FRONTEND (React + Nginx Proxy) ---
  frontend:
    build: ./SENT_frontend
    container_name: sent_frontend
    restart: always
    ports:
      - "80:80" # Chạy trực tiếp trên cổng 80 để không cần gõ :3000
    depends_on:
      - backend
    stdin_open: true 

volumes:
  postgres_data:
  mongo_data: