version: '3.8'

services:
  # --- DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: sent_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Thanh@123"
      POSTGRES_DB: sent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongodb: # THÊM MỚI
    image: mongo:latest
    container_name: sent_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  # --- BACKEND ---
  backend:
    build: ./SENT_backend
    container_name: sent_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mongodb
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD="Thanh@123"
      - DB_NAME=sent_db
      - PORT=8000
      - ALLOWED_ORIGINS=http://192.168.2.1
      - MONGO_HOST=mongo
      - MONGODB_URI=mongodb://mongodb:27017

  # --- FRONTEND ---
  frontend:
    build: ./SENT_frontend
    container_name: sent_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    stdin_open: true 

volumes:
  postgres_data:
  mongo_data: