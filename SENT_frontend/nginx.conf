server {
    listen 80;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dòng quan trọng nhất: Nếu không tìm thấy file, hãy trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho các tệp tĩnh để tăng tốc độ load
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}