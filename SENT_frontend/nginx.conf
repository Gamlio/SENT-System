# Khởi tạo vùng nhớ (zone) Rate Limit: Lưu trữ IP trong 10MB RAM (~160.000 IPs) với mức 10 requests/giây
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
     location /api {
        # Áp dụng giới hạn: Cho phép hàng đợi (burst) 20 requests, xử lý ngay lập tức (nodelay)
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;  
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. DÀNH CHO WEBSOCKET (Sửa lỗi Connection Refused)
     location /api/v1/ws {
        proxy_pass http://backend:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade'; 
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cấu hình cache cho các tệp tĩnh để tăng tốc độ load
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}