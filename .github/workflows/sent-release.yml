name: SENT Agent Release

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi bạn đẩy tag như v4.0, v4.1...

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Multi-OS Binaries
        # ĐÂY LÀ BÍ QUYẾT: Bạn dùng lệnh 'cd SENT' để chuyển vào đúng thư mục phần mềm
        run: |
          cd SENT
          go mod tidy # Đảm bảo tải đủ thư viện
          mkdir -p ../dist # Tạo thư mục chứa file build

          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/SENT_windows.exe ./cmd/main.go
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/SENT_linux ./cmd/main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/SENT_mac ./cmd/main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/* 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify SENT Website (Auto-Import)
      
        run: |
          curl -X POST https://sent.com.vn/api/v1/internal/update-version \
          -H "Content-Type: application/json" \
          -H "X-Internal-Token: ${{ secrets.INTERNAL_UPDATE_TOKEN }}" \
          -d '{
            "tag": "${{ github.ref_name }}",
            "url_prefix": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          }'