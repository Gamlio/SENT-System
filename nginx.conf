server {
    listen 80;
    server_name sent.com.vn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location /api/v1/auth {
        proxy_pass http://auth-service:8000;
    }

    location /api/v1/assets {
        client_max_body_size 20M;
        proxy_pass http://asset-service:8000;
    }

    location /api/v1/behaviors {
        proxy_pass http://behavior-service:8000;
    }

    location /api/v1/dashboard {
        proxy_pass http://dashboard-service:8000;
    }

    location /api/v1/incidents {
        proxy_pass http://incident-service:8000;
    }

    location /api/v1/policies {
        proxy_pass http://policy-service:8000;
    }

    location /api/v1/docs {
        client_max_body_size 50M;
        proxy_pass http://document-service:8000;
    }

    location /api/v1/ai {
        proxy_read_timeout 300;
        proxy_pass http://ai-service:8000;
    }

    location /api/v1/groups {
        proxy_pass http://groups-service:8000;
    }   

    location /api/v1/scoring {
        proxy_pass http://scoring-service:8000;
    }

    location /api/v1/users {
        proxy_pass http://user-service:8000;
    }

    location /api/v1/software {
        proxy_pass http://software-service:8000;
    }
    location /api/v1/approvals {
    proxy_pass http://approval-service:8000;
    }
    location /api/v1/ws {
        proxy_pass http://incident-service:8000/ws; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; 
    }

    location /uploads/ {
        proxy_pass http://document-service:8000/uploads/;
        add_header Content-Disposition inline;
    }
}